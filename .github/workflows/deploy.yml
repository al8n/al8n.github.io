name: Verify and deploy public website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
env:
  ASTRO_TELEMETRY_DISABLED: 1
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24.11.0'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned PDF dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Install site dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Generate public resume
        run: npm run resume
      - name: Check source and build
        run: npm run check && npm test && npm run build
      - name: Review public content and Git history
        env:
          PRIVATE_CONTENT_DENYLIST: ${{ secrets.PRIVATE_CONTENT_DENYLIST }}
        run: npm run verify:privacy
      - name: Install browser
        run: npx playwright install --with-deps --only-shell chromium
      - name: Browser and responsive verification
        run: |
          npm run preview -- --port 4321 > /tmp/al8n-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4321/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser
      - name: Save browser review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-review
          path: tmp/qa/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload approved website artifact
        if: github.event_name != 'pull_request' && vars.PUBLIC_CONTENT_APPROVED == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PUBLIC_CONTENT_APPROVED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved public content
        id: deployment
        uses: actions/deploy-pages@v5
